services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: molab-landing-page:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
      - CONTACT_PHP_ENDPOINT=${CONTACT_PHP_ENDPOINT:-https://artecinvent.com/contact-smtp-molab.php}
    env_file:
      - .env
    restart: unless-stopped

